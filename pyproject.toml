[project]
name = "ragprobe"
version = "0.1.0"
description = "Pluggable evaluation framework for RAG pipelines"
requires-python = ">=3.11"
dependencies = [
    "deepeval>=4.0.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragprobe"]
